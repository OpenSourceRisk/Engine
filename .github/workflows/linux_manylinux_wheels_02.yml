name: Linux x86_64 ManyLinux Wheels (cp*)

on:
  push:
    tags:
       - 'v*'
  workflow_dispatch:

jobs:
  wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-wheel: "cp38"
            python-version: "3.8"
          - python-wheel: "cp39"
            python-version: "3.9"
          - python-wheel: "cp310"
            python-version: "3.10"
          - python-wheel: "cp311"
            python-version: "3.11"
          - python-wheel: "cp312"
            python-version: "3.12"
          - python-wheel: "cp313"
            python-version: "3.13"
          - python-wheel: "3.14"
            python-version: "3.14"
    steps:
    - name: Free Disk Space on Runner 
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        docker system prune -af || true
        df -h
    - name: Checkout ORE
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      if: matrix.python-version != '3.13'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    - name: Install setuptools for Python 3.12
      if: matrix.python-version == '3.12'
      run: |
        pip install setuptools
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 15
    - name: Install eigen
      run: |
        curl -O -L https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
        tar zxvf eigen-3.4.0.tar.gz
        cd eigen-3.4.0
        mkdir build
        cd build
        cmake ..
        export 
        export Eigen3_DIR=$CURRENT_DIR/eigen-3.4.0
    - name: Build Zlib
      run: |
        pwd
        curl -O -L https://www.zlib.net/zlib-1.3.2.tar.gz
        tar xzvf zlib-1.3.2.tar.gz
        cd zlib-1.3.2
        ./configure
        make
        export ZLIB_ROOT=$CURRENT_DIR/zlib-1.3.2
    - name: Copy Configuration
      run: |
         pwd
         cp ORE-SWIG/Wheels/oreanalytics-config.linux ORE-SWIG/oreanalytics-config
         chmod +x ORE-SWIG/oreanalytics-config
         cd ORE-SWIG/Wheels
         chmod +x before_all_linux.sh
    - name: Build ORE wheels
      uses: pypa/cibuildwheel@v3.3.1
      env:
        #CIBW_BUILD: "*-manylinux_x86_64"
        #CIBW_SKIP: cp36-* pp*
        #CIBW_BUILD: cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64
        CIBW_BUILD: ${{matrix.python-wheel}}-manylinux_x86_64
        CIBW_ARCHS_LINUX: x86_64
        CIBW_BUILD_VERBOSITY: 2
        CIBW_BEFORE_BUILD_LINUX: ./ORE-SWIG/Wheels/before_all_linux.sh
        #CIBW_ENVIRONMENT_LINUX: CXXFLAGS="-O3 -g0"
        CIBW_ENVIRONMENT_LINUX: >
          CXXFLAGS="-std=c++20 -DNDEBUG -O3 -g0"
          ORE=/project
          LD_LIBRARY_PATH=/usr/local/lib64:$LD_LIBRARY_PATH
        CIBW_ENVIRONMENT_PASS_LINUX: CXXFLAGS
      with:
        package-dir: ${{ github.workspace }}/ORE-SWIG
    - name: Save wheels as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-manylinux-x86_64-${{ matrix.python-version }}
        path: ./wheelhouse/*.whl
